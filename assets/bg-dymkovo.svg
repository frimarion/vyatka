<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <title>Vyatka — soft Dymkovo inspired background tile</title>
  <desc>Seamless, light geometric background pattern for repeat in the poker club app.</desc>
  <rect width="720" height="720" fill="#FFF7E9"/>

  <!-- Quiet vertical rhythm, as in the app concept. -->
  <path d="M154 0v720m27-720v720M393 0v720m32-720v720M662 0v720"
        fill="none" stroke="#F5DFC3" stroke-width="10" opacity=".42"/>

  <!-- Dymkovo-inspired concentric circles. -->
  <circle cx="113" cy="161" r="78" fill="none" stroke="#F8DFBE" stroke-width="24" opacity=".76"/>
  <circle cx="113" cy="161" r="40" fill="#F6CBB3" opacity=".73"/>
  <circle cx="557" cy="526" r="92" fill="none" stroke="#F6D7B4" stroke-width="26" opacity=".69"/>
  <circle cx="557" cy="526" r="50" fill="#F7CCB3" opacity=".73"/>
  <circle cx="430" cy="132" r="45" fill="none" stroke="#F9E3C7" stroke-width="16" opacity=".72"/>
  <circle cx="430" cy="132" r="18" fill="#F8D9C6" opacity=".55"/>

  <!-- Rows of hand-painted dots. -->
  <g fill="#F2BA9B" opacity=".53">
    <circle cx="42" cy="420" r="10"/><circle cx="42" cy="457" r="10"/>
    <circle cx="42" cy="494" r="10"/><circle cx="42" cy="531" r="10"/>
    <circle cx="42" cy="568" r="10"/><circle cx="42" cy="605" r="10"/>
    <circle cx="638" cy="180" r="11"/><circle cx="638" cy="219" r="11"/>
    <circle cx="638" cy="258" r="11"/><circle cx="638" cy="297" r="11"/>
  </g>

  <!-- A few asymmetric painted polka dots. -->
  <g opacity=".66">
    <circle cx="309" cy="75" r="15" fill="#EFBEA3"/>
    <circle cx="270" cy="215" r="13" fill="#B8CCD5"/>
    <circle cx="327" cy="479" r="21" fill="#B9CCD2" opacity=".7"/>
    <circle cx="214" cy="625" r="15" fill="#EEC3A6"/>
    <circle cx="488" cy="361" r="14" fill="#F3CCB4"/>
    <circle cx="696" cy="399" r="13" fill="#F1CCAB"/>
  </g>

  <!-- Lightly abstracted painted leaves from the chosen reference. -->
  <g fill="#F7D7B5" opacity=".70">
    <path d="M260 397q-2-60 25-122q-16 69-8 122z"/>
    <path d="M273 344q-49-2-58-51q44 11 58 51z"/>
    <path d="M279 327q4-56 53-77q-15 45-53 77z"/>
    <path d="M279 384q-42-12-45-51q33 12 45 51z"/>
    <path d="M537 268q-1-48 20-95q-12 55-5 95z"/>
    <path d="M544 229q-37-1-44-39q34 8 44 39z"/>
    <path d="M549 217q5-42 40-58q-9 35-40 58z"/>
  </g>

  <!-- Sparing tiny color notes keep the ornamental reference recognizable. -->
  <g opacity=".48">
    <circle cx="320" cy="369" r="6" fill="#CB7051"/>
    <circle cx="300" cy="385" r="6" fill="#5E95B4"/>
    <circle cx="584" cy="270" r="6" fill="#6B9D80"/>
  </g>
</svg>
