# Выкладка фронта на vyatkapoker.ru (shared-хостинг reg.ru, Host-0).
#
# Сайт — статика без сборки, поэтому «деплой» = синхронизация файлов в каталог
# сайта на хостинге. Собирать нечего, но тесты ядра перед выкладкой прогнать
# стоит: таймер правят вечером перед турниром, и сломанный расчёт уровня уедет
# на ТВ в зале быстрее, чем кто-то его заметит.
#
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST        — сервер хостинга из раздела «Доступы» (вида sXX.hosting.reg.ru)
#   DEPLOY_USER        — пользователь SSH/SFTP (вида uXXXXXXX)
#   DEPLOY_SSH_KEY     — приватный ключ этого пользователя, целиком
#   DEPLOY_KNOWN_HOSTS — вывод `ssh-keyscan -p <порт> <сервер>`
#   DEPLOY_PATH        — каталог сайта, вида /var/www/uXXXXXXX/data/www/vyatkapoker.ru
# Переменная (Variables):
#   DEPLOY_PORT        — порт SSH, если не 22

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Две выкладки подряд не должны синхронизироваться друг поверх друга на полпути.
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/core.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Каталог ровно с тем, что должно лежать в вебруте: на хостинг не уезжают
      # ни миграции, ни рунбук с именами хостов, ни тесты.
      - name: Собрать каталог сайта
        run: |
          mkdir -p dist
          # Страницы не перечисляем руками: в корне репозитория .html — это и
          # есть страницы сайта, других там нет. Список был захардкожен, и
          # первая выкладка /legal уехала без самой страницы: на хостинге она
          # молча стала 404, потому что проверка ниже смотрела тот же список.
          # index.html — приложение игрока, оно же Mini App на корне домена.
          # start.html — служебный хаб со ссылками (/start).
          PAGES=$(ls *.html)
          cp $PAGES dist/
          cp deploy/htaccess dist/.htaccess
          # email/ — не страница сайта, а шаблон письма GoTrue: он забирает его
          # с домена по адресу из GOTRUE_MAILER_TEMPLATES_MAGIC_LINK.
          cp -r css js lib assets email dist/
          # Растровый оригинал логотипа нужен для правок макета, а не браузеру.
          rm -f dist/assets/logo-source.png

          # Версия в адресе css/js/lib/assets. Кэшем этих файлов мы не управляем:
          # `.htaccess` просит `no-cache`, но до Apache они не доходят — на
          # shared-хостинге их отдаёт фронтовый сервер, и отдаёт со своим
          # `max-age=3888000`, то есть на сорок пять дней. Проверяется одной
          # строкой: `curl -sI https://vyatkapoker.ru/js/config.js`.
          #
          # Поймалось это выкладкой входа через VK: `index.html` (он как раз
          # `no-cache`) приехал новый, а `config.js` вернувшийся игрок взял из
          # кэша — кнопки VK у него просто не было. Адрес с `?v=<sha>` меняется
          # с каждой выкладкой, поэтому браузеру нечего доставать из кэша.
          VER=$(git rev-parse --short HEAD)
          for f in dist/*.html; do
            sed -i -E "s#(src|href)=\"((js|css|lib|assets)/[^\"?]+)\"#\1=\"\2?v=$VER\"#g" "$f"
          done
          grep -q "js/config.js?v=$VER" dist/index.html || { echo "версия не проставилась"; exit 1; }
          grep -q "assets/logo.svg?v=$VER" dist/index.html || { echo "версия логотипа не проставилась"; exit 1; }
          # Страница, которой нет в dist, на хостинге превращается в 404 молча:
          # rsync --delete уберёт старую копию, а новую кто-то забыл положить.
          for f in $PAGES; do
            test -s "dist/$f" || { echo "не собралось: $f"; exit 1; }
          done

      - name: Ключ и known_hosts
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Отпечаток берём из секрета, а не keyscan-ом на лету: иначе первый же
          # подменённый ответ DNS мы бы приняли как «новый сервер» и отдали доступ.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # --delete убирает с хостинга то, чего нет в репозитории: вебрут держим
      # зеркалом main, иначе забытый старый файл переживёт переименование.
      # Если на тарифе нет rsync, замени шаг на lftp-вариант из deploy/site.md.
      - name: rsync на хостинг
        env:
          RHOST: ${{ secrets.DEPLOY_HOST }}
          RUSER: ${{ secrets.DEPLOY_USER }}
          RPATH: ${{ secrets.DEPLOY_PATH }}
          RPORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          rsync -rlptz --delete --checksum \
            -e "ssh -i ~/.ssh/id_deploy -p $RPORT -o IdentitiesOnly=yes" \
            dist/ "$RUSER@$RHOST:$RPATH/"

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Проверить, что сайт отвечает
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://vyatkapoker.ru/)
          echo "GET / → $code"
          test "$code" = "200"
