# nginx перед Supabase-стеком Вятки.
# Наружу торчит только 443; Kong слушает локально на 8000 и в интернет не смотрит.
#
#   /etc/nginx/sites-available/vyatka  →  ln -s ... /etc/nginx/sites-enabled/
#   certbot --nginx -d api.vyatkapoker.ru

server {
    listen 80;
    server_name api.vyatkapoker.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.vyatkapoker.ru;

    ssl_certificate     /etc/letsencrypt/live/api.vyatkapoker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vyatkapoker.ru/privkey.pem;

    # Состояние комнаты — это один JSONB на весь турнир, он растёт со списком
    # игроков и оплатами; дефолтного лимита в 1 МБ хватает, но впритык.
    client_max_body_size 8m;

    # Дашборд Supabase Studio наружу не отдаём: к нему ходят через SSH-туннель
    # (ssh -L 3000:localhost:3000 …). Одной дырой меньше.
    location /project { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime — websocket: без upgrade дисплей молча свалится на опрос.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Долгие подписки realtime не должны рваться по таймауту.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
